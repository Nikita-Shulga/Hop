name: Local View apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple silicon
            target: mac-arm64
          - os: macos-15-intel    # Intel (macos-13 runners are retired)
            target: mac-x64
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          PYTHON: python3
          VENV: ${{ runner.temp }}/venv
        run: bash packaging/build-mac.sh
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: packaging\build-windows.bat
      # Start the built app (no window) and sign in to it, so a broken build never gets published.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "dist/Local View.app/Contents/MacOS/Local View" --headless --no-easy-port --port 8799 --pin 123456 --debug > app.log 2>&1 &
          "$RUNNER_TEMP/venv/bin/python" packaging/smoke_test.py 8799 123456 || { cat app.log; cat ~/.localview.log 2>/dev/null; exit 1; }
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath "dist\LocalView\LocalView.exe" -ArgumentList "--headless","--no-easy-port","--port","8799","--pin","123456"
          .\.venv\Scripts\python.exe packaging\smoke_test.py 8799 123456
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:USERPROFILE\.localview.log" -ErrorAction SilentlyContinue; exit 1 }
      - name: Check the zip
        shell: bash
        run: ls -l dist/LocalView-*-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LocalView-${{ matrix.target }}
          path: dist/LocalView-*.zip
          if-no-files-found: error

  # A tag such as v1.1.0 publishes a GitHub Release with the three zips and SHA256SUMS.txt.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches packaging/VERSION
        run: |
          version="$(tr -d '[:space:]' < packaging/VERSION)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packaging/VERSION ($version)."; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: LocalView-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Local View ${{ github.ref_name }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
