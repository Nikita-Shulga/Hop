name: Feature request
description: Suggest an idea for Hop
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Hop to do?
      description: A new control, a device it should work with, a setting…
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When would it help?
      description: Describe the situation. For example, "I control my PC from the sofa and…"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Windows
        - iPhone / iPad
        - Android
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
