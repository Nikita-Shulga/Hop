<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="How Hop connects: on Wi-Fi directly with a PIN; over the internet your own server introduces the devices, then video and control go directly between them, encrypted.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F0F11"/><stop offset="1" stop-color="#141210"/></linearGradient>
    <linearGradient id="hop" gradientUnits="userSpaceOnUse" x1="392" y1="0" x2="888" y2="0"><stop offset="0" stop-color="#F28422"/><stop offset="1" stop-color="#F69C34"/></linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F69C34"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55555C"/></marker>
  </defs>
  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>
  <g transform="translate(90 290)">
    <rect width="280" height="210" rx="22" fill="#1A1A1D" stroke="#2C2C31" stroke-width="2"/>
    <rect x="118" y="34" width="44" height="78" rx="10" fill="none" stroke="#F2F2F4" stroke-width="5"/><rect x="132" y="100" width="16" height="4" rx="2" fill="#F2F2F4"/>
    <text x="140.0" y="152" text-anchor="middle" fill="#F2F2F4" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">Phone or laptop</text>
    <text x="140.0" y="184" text-anchor="middle" fill="#9A9AA3" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19">Browser or Hop app</text>
  </g>
  <g transform="translate(910 290)">
    <rect width="280" height="210" rx="22" fill="#1A1A1D" stroke="#2C2C31" stroke-width="2"/>
    <rect x="96" y="36" width="88" height="60" rx="10" fill="none" stroke="#F2F2F4" stroke-width="5"/><rect x="122" y="104" width="36" height="6" rx="3" fill="#F2F2F4" opacity=".6"/>
    <text x="140.0" y="152" text-anchor="middle" fill="#F2F2F4" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">Your computer</text>
    <text x="140.0" y="184" text-anchor="middle" fill="#9A9AA3" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19">Running Hop</text>
  </g>
  <g transform="translate(500 40)">
    <rect width="280" height="190" rx="22" fill="#1A1A1D" stroke="#2C2C31" stroke-width="2"/>
    <path d="M110 92h60a20 20 0 0 0 0-40a28 28 0 0 0-54-6a22 22 0 0 0-6 46z" fill="none" stroke="#9A9AA3" stroke-width="5" stroke-linejoin="round"/>
    <text x="140.0" y="132" text-anchor="middle" fill="#F2F2F4" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">Your free server</text>
    <text x="140.0" y="164" text-anchor="middle" fill="#9A9AA3" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19">Only introduces them</text>
  </g>
  <!-- the direct, encrypted path -->
  <path d="M392 395 H888" stroke="url(#hop)" stroke-width="8" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="640" y="372" text-anchor="middle" fill="#F2F2F4" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Screen, control, files — direct</text>
  <text x="640" y="436" text-anchor="middle" fill="#9A9AA3" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18">Wi-Fi: PIN · Internet: ID + password, encrypted</text>
  <!-- introductions via the server (internet only) -->
  <path d="M300 285 C 330 200, 400 150, 488 140" fill="none" stroke="#55555C" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#ag)"/>
  <path d="M980 285 C 950 200, 880 150, 792 140" fill="none" stroke="#55555C" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#ag)"/>
  <text x="300" y="185" text-anchor="middle" fill="#9A9AA3" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18">internet only:</text>
  <text x="300" y="208" text-anchor="middle" fill="#9A9AA3" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18">“which computer?”</text>
  <text x="985" y="196" text-anchor="middle" fill="#9A9AA3" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18">stays reachable</text>
</svg>
